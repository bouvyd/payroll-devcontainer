[options]
; Config for the `partena_client` container — the CUSTOMER instance.
; Selected via ODOO_RC / ODOO_LOCAL_CONF (set on the service in docker-compose.yml).
; Custom addons come from psbe-partena-standard (mounted at src/partena-standard).
addons_path =
    /workspace/src/odoo/addons,
    /workspace/src/enterprise,
    /workspace/src/design-themes,
    /workspace/src/partena-standard

; Own filestore/sessions so the two servers don't collide on the shared mount.
data_dir = /workspace/.odoo/client

; Database (the `db` service on the compose network).
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

admin_passwd = admin
; http_port == host port so http://partena_client:8089 works on the network too.
http_port = 8089
gevent_port = 8090

; Behind the host nginx reverse proxy (client.partena) — trust X-Forwarded-* headers.
proxy_mode = True

; Dev-friendly: single process, no request timeouts so breakpoints don't die.
workers = 0
max_cron_threads = 1
limit_time_cpu = 0
limit_time_real = 0

; log_level = debug
; logfile = /workspace/logs/odoo.log
