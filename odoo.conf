[options]
; Local machine config (git-ignored). Edit freely — see odoo.conf.example.

addons_path =
    /workspace/src/odoo/addons,
    /workspace/src/enterprise,
    /workspace/src/design-themes,
    /workspace/src/custom,
    /workspace/src/custom/ps-internal-coda-reject,
    /workspace/src/custom/ps-internal-edi

db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

admin_passwd = admin
http_port = 8069
gevent_port = 8072

data_dir = /workspace/.odoo

workers = 0
max_cron_threads = 1
limit_time_cpu = 0
limit_time_real = 0

; log_level = debug
; logfile = /workspace/logs/odoo.log

; smtp_server = localhost
; smtp_port = 25
; smtp_ssl = False
; smtp_user =
; smtp_password =
