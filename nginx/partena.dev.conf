# Local reverse proxy for the two Partena dev instances.
#
#   http://custom.partena.localhost  -> partena_custom (central)  127.0.0.1:8099
#   http://client.partena.localhost  -> partena_client (customer) 127.0.0.1:8089
#
# Setup on the host (laptop):
#   1. /etc/hosts:
#        127.0.0.1  client.partena.localhost custom.partena.localhost
#   2. Install this file where nginx includes it FROM INSIDE the `http {}` block
#      (the directives below are http-context — a main-context include such as
#      modules.d/ will fail with "upstream directive is not allowed here"):
#        Debian/Ubuntu: /etc/nginx/conf.d/partena.conf  (already http-included)
#        macOS (brew):  $(brew --prefix)/etc/nginx/servers/partena.conf
#        Arch/CachyOS:  the stock nginx.conf has NO http-level include, so add
#                       one once, then drop this file in conf.d:
#          sudo mkdir -p /etc/nginx/conf.d
#          sudo cp nginx/partena.dev.conf /etc/nginx/conf.d/partena.conf
#          sudo sed -i '/^http {/a\    include /etc/nginx/conf.d/*.conf;' /etc/nginx/nginx.conf
#   3. sudo nginx -t && sudo systemctl reload nginx   (or: sudo nginx -s reload)
#
# Multi-threaded Odoo (workers>0 with gevent, or the dev single-process server)
# serves websockets over the same HTTP port, so no split /websocket upstream is
# needed — it degrades to HTTP through this one proxy_pass.
#
# NOTE: this proxies over plain HTTP (port 80). Unlike the production sample,
# the session cookie is NOT flagged `secure` and HSTS is not sent — a `secure`
# cookie would never be sent back over http:// and would break login locally.
# Add TLS + those headers if you later front this with https.

upstream partena_custom {
  server 127.0.0.1:8099;
}

upstream partena_client {
  server 127.0.0.1:8089;
}

# --- shared proxy behaviour --------------------------------------------------
# Longer timeouts so long-polling / heavy requests don't get cut off.
proxy_read_timeout 720s;
proxy_connect_timeout 720s;
proxy_send_timeout 720s;

gzip on;
gzip_types text/css text/scss text/plain text/xml application/xml application/json application/javascript;

# --- central: custom.partena.localhost ---------------------------------------
server {
  listen 80;
  server_name custom.partena.localhost;

  access_log /var/log/nginx/partena_custom.access.log;
  error_log  /var/log/nginx/partena_custom.error.log;

  location / {
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
    proxy_pass http://partena_custom;

    proxy_cookie_flags session_id samesite=lax;  # requires nginx 1.19.8
  }
}

# --- customer: client.partena.localhost --------------------------------------
server {
  listen 80;
  server_name client.partena.localhost;

  access_log /var/log/nginx/partena_client.access.log;
  error_log  /var/log/nginx/partena_client.error.log;

  location / {
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
    proxy_pass http://partena_client;

    proxy_cookie_flags session_id samesite=lax;  # requires nginx 1.19.8
  }
}
